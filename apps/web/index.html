      <h1>Vind jouw perfecte dart</h1>
      <p>DartFit is een gratis website die darts zoekt die bij je hand passen. Je meet je hand naast een pasje (de foto blijft op je telefoon), beantwoordt vijf vragen over je grip en worp, en krijgt je ideale dart plus de echte steeltip darts die er het best bij passen, in drie prijsklassen. Ook in het Engels en Duits, en met een cadeaustand zonder handscan.</p>
