      <h1>Find darts that actually feel right in your hand</h1>
      <p>DartFit is a free website that finds steel-tip darts to suit your hand. You snap your hand next to a bank card (the photo stays on your phone), answer a few easy questions about how you hold and throw, and get your ideal barrel plus the real darts that fit it best, in three price classes. There is also a gift helper that needs no photo at all.</p>
      <h2>How does DartFit measure your hand?</h2>
      <ol>
        <li>Lay your hand flat next to any bank card and take a photo. The card is 85.6 mm wide, so it gives the scale; your phone finds 21 points on your hand and measures your fingers and palm in millimetres.</li>
        <li>Answer a few questions: where you hold the dart, how many fingers touch it, how you throw and how much grip you like.</li>
        <li>The model turns that into a range for weight, length and thickness and scores every dart in the catalogue. You see the best one per price class, and the pro whose dart is closest.</li>
      </ol>
      <p>Measuring your hand needs JavaScript. Everything else works without it:</p>
