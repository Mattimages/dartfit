      <h1>Find darts that actually feel right in your hand</h1>
      <p>DartFit is a free website that finds steel-tip darts to suit your hand. You snap your hand next to a bank card (the photo stays on your phone), answer a few easy questions about how you hold and throw, and get your ideal barrel plus the real darts that fit it best, in three price brackets. It also works in Dutch and German, and there is a gift helper that needs no photo at all.</p>
      <p>DartFit needs JavaScript to measure your hand, but our guides work without it:</p>
